<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>TITRE</title>
    <!-- Installable sur l'écran d'accueil (iPhone et Android) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TITRE" />
    <style id="expo-reset">
      html, body { height: 100%; background: #0E0B1F; overscroll-behavior: none; }
      body { overflow: hidden; -webkit-tap-highlight-color: transparent; }
      /* iPhone : la page ne doit jamais glisser (sinon bande vide ou écran vide qui reste). */
      body { position: fixed; inset: 0; margin: 0; touch-action: none; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Activez JavaScript pour lire TITRE.</noscript>
    <div id="root"></div>
    <!-- iPhone (iOS 26), mode app : tant que la page est plus courte que l'écran, l'iPhone arrête l'affichage 62 px avant le bas
         (bande sombre, bug WebKit 301108). Une page au moins aussi haute que l'écran lui rend toute la hauteur. -->
    <script>if (navigator.standalone) document.documentElement.style.minHeight = 'min(100lvh, calc(100% + env(safe-area-inset-top)))';</script>
    <!-- iPhone : la page reste parfois remontée après la fermeture du clavier. -->
    <script>addEventListener('focusout', function () { setTimeout(function () { if (scrollY) scrollTo(0, 0); }, 100); });</script>
  </body>
</html>
