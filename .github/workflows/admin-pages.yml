name: Back office en ligne

on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/admin-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Variables du dépôt (pas des secrets : la clé « anon » est faite pour être publique).
          # Tant qu'elles sont vides, le back office s'ouvre en mode démo.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist
      - id: pages
        uses: actions/deploy-pages@v4
