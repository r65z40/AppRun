name: Installer la base

# Installe ou met à jour la base Supabase toute seule (tables, droits, sources de départ).
# Se lance à chaque nouvelle version sur main, ou à la main : Actions > Installer la base > Run workflow.
on:
  push:
    branches: [main]
    paths: ['backend/supabase/**', 'backend/src/migrate.ts', '.github/workflows/install.yml']
  workflow_dispatch:

concurrency: install

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Mettre la base à jour
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run install-db
