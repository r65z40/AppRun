name: Dernière minute

on:
  schedule:
    # Toutes les 20 min, de 6 h à 23 h 50 à Paris en hiver. Minutes décalées : GitHub saute souvent
    # les tâches prévues pile à :00, :20 ou :40, les moments les plus chargés.
    - cron: '7,17,27,37,47,57 5-22 * * *' # créneaux en double : GitHub en saute beaucoup
  workflow_dispatch:

concurrency: flash

# issues : ouvrir un ticket (et donc un e-mail au propriétaire du dépôt) si le moteur plante.
permissions:
  contents: read
  issues: write

jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Chercher les infos de dernière minute
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLASH_AUTO_PUBLISH: ${{ vars.FLASH_AUTO_PUBLISH }}
          TITRE_MODEL: ${{ vars.TITRE_MODEL }}
        run: npm run flash
      - name: Appliquer les e-mails réglés dans le back office
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          # Les liens des e-mails ramènent vers l'app web et le back office publiés ici.
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run mail
      - name: Prévenir l'équipe si le moteur plante
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Moteur en panne : Dernière minute'
        run: |
          # Un seul ticket ouvert à la fois : on n'en recrée pas tant que le précédent n'est pas fermé.
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number -q '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "Le passage du $(TZ=Europe/Paris date '+%d/%m à %H:%M') a échoué.

          Ce qui s'est passé : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Le détail est aussi dans le back office, page Moteur. Fermez ce ticket une fois le problème réglé : le prochain plantage en ouvrira un nouveau."
          fi
