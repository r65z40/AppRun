name: Dernière minute

on:
  schedule:
    # Toutes les 20 min, de 6 h à 23 h 50 à Paris en hiver. Minutes décalées : GitHub saute souvent
    # les tâches prévues pile à :00, :20 ou :40, les moments les plus chargés.
    - cron: '7,27,47 5-22 * * *'
  workflow_dispatch:

concurrency: flash

jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Chercher les infos de dernière minute
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLASH_AUTO_PUBLISH: ${{ vars.FLASH_AUTO_PUBLISH }}
          TITRE_MODEL: ${{ vars.TITRE_MODEL }}
        run: npm run flash
