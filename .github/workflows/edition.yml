name: Édition du jour

on:
  schedule:
    - cron: '30 4 * * *' # 5 h 30 à Paris en hiver (6 h 30 en été)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date de l’édition (AAAA-MM-JJ), vide = aujourd’hui'
        required: false

concurrency: edition

# issues : ouvrir un ticket (et donc un e-mail au propriétaire du dépôt) si le moteur plante.
permissions:
  contents: read
  issues: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Construire l'édition
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          TITRE_MODEL: ${{ vars.TITRE_MODEL }}
        run: npm run engine -- ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: Prévenir l'équipe si le moteur plante
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Moteur en panne : Édition du jour'
        run: |
          # Un seul ticket ouvert à la fois : on n'en recrée pas tant que le précédent n'est pas fermé.
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number -q '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "Le passage du $(TZ=Europe/Paris date '+%d/%m à %H:%M') a échoué.

          Ce qui s'est passé : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Le détail est aussi dans le back office, page Moteur. Fermez ce ticket une fois le problème réglé : le prochain plantage en ouvrira un nouveau."
          fi
