name: "Premium : webhook RevenueCat"

# Met en ligne la fonction Supabase qui reçoit les achats envoyés par RevenueCat
# (backend/supabase/functions/revenuecat). À faire une fois, puis tout seul à chaque changement.
# Il faut dans Settings > Secrets and variables > Actions :
#   secret SUPABASE_ACCESS_TOKEN      : Supabase > Account > Access Tokens > Generate new token
#   secret REVENUECAT_WEBHOOK_SECRET  : une longue phrase au hasard, recopiée dans RevenueCat (Authorization header)
#   variable SUPABASE_URL             : déjà là (https://<projet>.supabase.co)
on:
  push:
    branches: [main]
    paths: ['backend/supabase/functions/**', '.github/workflows/premium.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Réglages présents ?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$WEBHOOK_SECRET" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::notice::Premium pas encore configuré (SUPABASE_ACCESS_TOKEN, REVENUECAT_WEBHOOK_SECRET ou SUPABASE_URL manquant) : rien à faire."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != '1'
        with:
          version: latest
      - name: Mettre la fonction en ligne
        if: steps.check.outputs.skip != '1'
        run: |
          supabase secrets set --project-ref "${{ steps.check.outputs.ref }}" REVENUECAT_WEBHOOK_SECRET="$WEBHOOK_SECRET"
          # RevenueCat n'envoie pas de jeton Supabase : la fonction vérifie elle-même son secret.
          supabase functions deploy revenuecat --project-ref "${{ steps.check.outputs.ref }}" --no-verify-jwt --use-api
          echo "Adresse à coller dans RevenueCat > Integrations > Webhooks : $SUPABASE_URL/functions/v1/revenuecat"
          echo "::notice::Webhook en ligne : $SUPABASE_URL/functions/v1/revenuecat"
